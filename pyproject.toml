[build-system]
requires = ["setuptools>=77", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "evmatch"
version = "0.1.0"
description = "Evidence-conditioned correlated matching: a sinter-compatible surface-code decoder for circuit-level noise"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy", "stim>=1.13", "sinter>=1.13"]
keywords = ["quantum error correction", "surface code", "decoder", "matching", "stim", "sinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
bench = ["pymatching>=2.3.1", "matplotlib", "scipy", "ldpc", "beliefmatching"]
test = ["pytest", "pymatching>=2.3.1", "scipy"]

[project.urls]
Homepage = "https://github.com/JimmyCarvalho/evmatch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["bench"]
testpaths = ["tests"]
