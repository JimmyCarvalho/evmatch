name: wheels
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_TEST_COMMAND: >-
            python -c "import evmatch, stim; c = evmatch.surface_code_si1000(3, 0.003);
            d = evmatch.EvMatchDecoder().compile_decoder_for_dem(dem=c.detector_error_model(decompose_errors=True));
            s, o = c.compile_detector_sampler().sample(1000, separate_observables=True);
            assert (d.decode_batch(s) != o).any(axis=1).mean() < 0.1"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
  publish:
    # Needs a PyPI "trusted publisher" for this repository and workflow (pypi.org > project > publishing).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
