name: release
# Push a branch release/vX.Y.Z (or a tag vX.Y.Z): builds wheels and the sdist,
# creates the tag and a GitHub release with them attached, and uploads to PyPI
# by trusted publishing (pypi.org pending publisher: project evmatch, owner
# JimmyCarvalho, repository evmatch, workflow release.yml, environment pypi).
# Until that publisher exists the upload fails without failing the release.
on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
jobs:
  build:
    uses: ./.github/workflows/wheels.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          echo "tag=${ref#release/}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: evmatch ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
  publish:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
